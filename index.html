<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#181b1f">
  <title>Click Odyssey</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="viewport.css">
</head>
<body>
  <div id="left-field" class="screen-field" aria-hidden="true"></div>
  <div id="game-shell">
  <header class="topbar"><span class="brand">CLICK ODYSSEY</span><span id="day"></span><button id="inspect" title="Лист персонажа">Герой / мир</button><button id="menu" aria-label="Меню">≡</button></header>
  <main>
    <div id="game-view">
    <section class="hero-strip" aria-label="Состояние героя">
      <canvas class="portrait" id="portrait" width="32" height="34" role="img" aria-label="Портрет героя"></canvas><div class="hero-name"><h2 id="name"></h2><span id="level"></span></div>
      <div class="vital"><div><span>HP</span><b id="health"></b></div><div class="meter"><i id="health-bar"></i></div></div>
      <div class="vital stamina"><div><span title="Силы"><span class="resource-full">Силы</span><abbr class="resource-short" title="Силы">Сил.</abbr></span><b id="energy"></b></div><div class="meter"><i id="energy-bar"></i></div></div>
      <div class="vital arcana" id="mana-vital" hidden><div><span>Мана</span><b id="mana"></b></div><div class="meter"><i id="mana-bar"></i></div></div>
      <div class="coins"><b id="gold"></b><small>зол.</small></div>
    </section>
    <section class="world" aria-label="Одномерный мир">
      <canvas id="scene" role="img" aria-label="Герой на дороге"></canvas>
      <div id="map-tools" hidden aria-label="Вид карты"><button id="map-follow" aria-label="Вернуться к герою" title="Вернуться к герою">◎</button><button id="map-zoom-out" aria-label="Отдалить карту">−</button><button id="map-zoom-in" aria-label="Приблизить карту">+</button><button id="map-auto" aria-label="Вернуться к обычному виду" hidden>↩</button></div>
      <div class="scene-label"><span id="location"></span><span id="biome"></span></div>
      <div class="scene-bottom"><span id="weather"></span><span id="tick"></span></div>
      <div id="effects" aria-label="Действующие эффекты"></div>
    </section>
    <div id="speech" class="speech" aria-live="polite"></div><section class="intention"><div><p id="intent"></p><span id="reason"></span></div><span id="action-type" class="tag"></span></section>
    </div>
    <section class="chronicle" aria-label="Последние события"><ol id="journal"></ol><span id="announcement" class="sr-only" aria-live="polite"></span></section>
    <div class="time-control"><button id="advance"><span id="advance-label">Следующий миг</span><span class="key">ПРОБЕЛ / +1</span></button><span class="tap-hint">Клик · зажать ×3 · авто 1/с</span></div><button id="continue-story" hidden>Начать следующую историю</button>
  </main>
  <dialog id="sheet" class="sheet"><header><h2>Лист приключения</h2><button id="close-sheet" aria-label="Закрыть лист">×</button></header><div class="tabs" role="tablist" aria-label="Сведения"><button role="tab" aria-selected="true" data-tab="hero">Герой</button><button role="tab" aria-selected="false" data-tab="skills">Развитие</button><button role="tab" aria-selected="false" data-tab="bag">Вещи</button><button role="tab" aria-selected="false" data-tab="ties">Отряд</button><button role="tab" aria-selected="false" data-tab="lineage">Род</button><button role="tab" aria-selected="false" data-tab="quests">Задания</button><button role="tab" aria-selected="false" data-tab="map">Мир</button><button role="tab" aria-selected="false" data-tab="archive">Жизни</button><button role="tab" aria-selected="false" data-tab="log">Журнал</button><button role="tab" aria-selected="false" data-tab="rules">Механики</button></div><div id="detail-panel" role="tabpanel"></div></dialog>
  <dialog id="settings-dialog"><header><h2>Меню</h2><button id="close-menu" aria-label="Закрыть меню">×</button></header><p id="world-age"></p><p id="save-status"></p><div class="menu-actions"><button id="road-view" aria-pressed="true">В дороге: карта</button><label class="map-option">Масштаб карты<select id="map-scope"><option value="auto">Авто</option><option value="overview">Общий вид</option><option value="region">Округ</option><option value="local">Тропы</option></select></label><label class="map-option">Слой<select id="map-layer"><option value="current">У персонажа</option></select></label><button id="map-preview">Просмотреть карту</button><button id="sound" aria-label="Включить звук">Звук: выкл.</button><button id="watch-remains" hidden>Наблюдать останки</button><button id="choose-observer">Наблюдать за другим</button><button id="mechanics">Центр управления механиками</button><button id="save-file">Скачать сохранение</button><label class="import-label">Загрузить сохранение<input id="load-file" type="file" accept="application/json,.json"></label><button id="undo-import" hidden>Вернуть предыдущее сохранение</button><button id="export">Скачать хронику</button><button id="run-life">Прожить год</button><button id="run-until-death">Наблюдать до смерти</button><button id="next-story" hidden>Начать следующую историю</button><button id="reset">Новый мир</button></div><small>Сборка <span id="build">dev</span></small></dialog>
  <dialog id="observer-dialog"><header><h2>Наблюдать за другим</h2><button id="close-observer" aria-label="Закрыть выбор">×</button></header><p id="observer-hint" class="empty"></p><p id="observer-status" role="status"></p><div id="observer-list"></div><button id="observer-new">Новый путник</button></dialog>
  <dialog id="reset-dialog"><h2>Начать новый мир?</h2><p>Текущий прогресс будет удалён.</p><div class="dialog-actions"><button id="cancel-reset">Отмена</button><button id="confirm-reset">Начать заново</button></div></dialog>
  <dialog id="life-summary"><header><h2 id="life-summary-title">Итог жизни</h2><button id="close-life-summary" aria-label="Закрыть итог">×</button></header><p class="empty">Мир продолжает жить. Можно остаться наблюдать или начать другую историю.</p><div class="dialog-actions"><button id="summary-watch-world">Наблюдать мир</button><button id="summary-remains" hidden>Наблюдать останки</button><button id="summary-observer">Выбрать жителя</button><button id="summary-next-story">Начать следующую историю</button></div><div id="life-summary-content"></div><button id="life-journal">Подробный журнал</button></dialog>
  </div>
  <div id="right-field" class="screen-field" aria-hidden="true"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
