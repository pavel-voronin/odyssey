name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - name: Build static game
        id: build
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { build } from './scripts/build.mjs';
          const release = await build();
          console.log(`path=${release.dir}`);
          NODE
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.build.outputs.path }}
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
